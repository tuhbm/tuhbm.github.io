name: Build & Deploy Hexo (master root)

on:
  push:
    branches: [ gh-pages ]   # 소스가 gh-pages에 커밋될 때마다 동작
  schedule:
    # 예약 발행: _config.yml의 future: false로 미래 날짜 글은 빌드에서 빠지므로,
    # 매일 09:17~14:47(KST) 30분마다 재빌드해 날짜가 된 글을 공개한다(글 시각 09:00~13:30 대응).
    # 정각(:00~:05)은 GitHub 예약 실행이 몰려 지연·누락이 잦아 17분·47분으로 둔다.
    # cron은 UTC 기준이며 GitHub 부하에 따라 수 분~수십 분 늦게 실행될 수 있다.
    - cron: '17,47 0-5 * * *'
  workflow_dispatch:         # Actions 탭에서 수동 재빌드

# push 빌드와 예약 빌드가 겹쳐 master 푸시가 충돌하지 않도록 순차 실행
concurrency:
  group: deploy-master
  cancel-in-progress: false

permissions:
  contents: write            # GITHUB_TOKEN으로 커밋/푸시 허용

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 로컬 개발 환경(npm 11)이 만든 package-lock.json을 npm ci로 읽으려면
          # 같은 npm 메이저가 필요하다. Node 24 = npm 11. (Node 20 = npm 10에서는
          # "Missing: chokidar@3.6.0 from lock file"로 npm ci 실패)
          node-version: '24'

      - name: Install deps
        run: npm ci

      - name: Build Hexo
        env:
          # 글 date를 KST로 해석한다. timezone 설정 대신 TZ를 쓰는 이유: timezone: Asia/Seoul로 두면
          # 러너(UTC)에서 00~09시 글 9편의 퍼머링크 날짜가 하루 앞당겨져 기존 URL이 깨진다.
          # TZ=Asia/Seoul은 해석·퍼머링크 모두 KST라 기존 URL이 그대로다(로컬 Windows 빌드와 동일).
          TZ: Asia/Seoul
        run: |
          npx hexo clean
          npx hexo generate     # ./public 생성

      - name: Deploy to master (root)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: master
          # 아래 옵션은 필요시 사용
          # force_orphan: false
          # commit_message: "build: ${{ github.sha }}"
